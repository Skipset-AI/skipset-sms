<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Opening Messages…</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0d12;
      color: #e8eaed;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .spinner {
      width: 34px; height: 34px;
      margin: 0 auto 18px;
      border: 3px solid rgba(255,255,255,.18);
      border-top-color: #34c759;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
    p.sub { margin: 0 0 22px; color: #9aa0a6; font-size: 14px; }
    a.btn {
      display: block;
      text-decoration: none;
      background: #34c759;
      color: #04210f;
      font-weight: 600;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 14px;
    }
    a.btn:active { opacity: .85; }
    .preview {
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: #c8ccd0;
    }
    .to { font-size: 13px; color: #9aa0a6; margin: 0 0 10px; }
    .hint { font-size: 12px; color: #6b7177; margin-top: 16px; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <main>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <h1 id="title">Opening Messages…</h1>
    <p class="sub" id="subtitle">If it doesn't open automatically, tap below.</p>
    <a class="btn" id="open" href="#" rel="noopener">Open Messages</a>
    <p class="to" id="to"></p>
    <div class="preview" id="preview"></div>
    <p class="hint">Inside Telegram you may need to tap “Open in Safari/Browser” first.</p>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var to = (params.get("to") || "").trim();
      var body = params.get("b") || params.get("body") || "";

      var titleEl = document.getElementById("title");
      var subEl = document.getElementById("subtitle");
      var openEl = document.getElementById("open");
      var toEl = document.getElementById("to");
      var previewEl = document.getElementById("preview");
      var spinnerEl = document.getElementById("spinner");

      if (!to) {
        titleEl.textContent = "Missing phone number";
        titleEl.className = "err";
        subEl.textContent = "This link is incomplete.";
        spinnerEl.style.display = "none";
        openEl.style.display = "none";
        return;
      }

      // Apple devices want sms:NUMBER&body=…  (Android uses ?body=…)
      var ua = navigator.userAgent || "";
      var apple = /iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(ua);
      var sep = apple ? "&" : "?";
      var smsUrl = "sms:" + to + sep + "body=" + encodeURIComponent(body);

      openEl.href = smsUrl;
      toEl.textContent = "To: " + to;
      previewEl.textContent = body;

      // Auto-launch Messages. The visible button is the manual fallback.
      setTimeout(function () { location.href = smsUrl; }, 250);
    })();
  </script>
</body>
</html>
